name: Matchblox
options:
  bundleIdPrefix: com.blox
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MatchbloxKit:
    path: MatchbloxKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.20.0"
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    from: "0.15.0"

targets:
  Matchblox:
    type: application
    platform: iOS
    sources:
      - path: Matchblox
      - path: MatchbloxIsland/IslandAttributes.swift
    info:
      path: Matchblox/Info.plist
      properties:
        CFBundleDisplayName: matchblox
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: matchblox uses the camera to scan the pairing code of your host.
        NSFaceIDUsageDescription: Face ID unlocks the key that opens your console.
        NSSupportsLiveActivities: true
        MatchbloxAppGroup: group.$(MATCHBLOX_BUNDLE_ID)
        MatchbloxKeychainGroup: $(AppIdentifierPrefix)$(MATCHBLOX_BUNDLE_ID).shared
        CFBundleURLTypes:
          - CFBundleURLName: com.blox.matchblox.pair
            CFBundleURLSchemes: [matchblox]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        MATCHBLOX_BUNDLE_ID: com.blox.matchblox
        PRODUCT_BUNDLE_IDENTIFIER: $(MATCHBLOX_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Matchblox/Matchblox.entitlements
    dependencies:
      - package: MatchbloxKit
        product: MatchbloxKit
      - package: SwiftTerm
        product: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - target: MatchbloxIsland
      - target: MatchbloxBuzz

  MatchbloxIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: MatchbloxIsland
      - path: Matchblox/Tokens.swift
    info:
      path: MatchbloxIsland/Info.plist
      properties:
        CFBundleDisplayName: matchblox
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        MatchbloxAppGroup: group.$(MATCHBLOX_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MATCHBLOX_BUNDLE_ID: com.blox.matchblox
        PRODUCT_BUNDLE_IDENTIFIER: $(MATCHBLOX_BUNDLE_ID).island
        CODE_SIGN_ENTITLEMENTS: MatchbloxIsland/MatchbloxIsland.entitlements
    dependencies:
      - package: MatchbloxKit
        product: MatchbloxKit

  MatchbloxBuzz:
    type: app-extension
    platform: iOS
    sources:
      - path: MatchbloxBuzz
    info:
      path: MatchbloxBuzz/Info.plist
      properties:
        CFBundleDisplayName: matchblox
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        MatchbloxAppGroup: group.$(MATCHBLOX_BUNDLE_ID)
        MatchbloxKeychainGroup: $(AppIdentifierPrefix)$(MATCHBLOX_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MATCHBLOX_BUNDLE_ID: com.blox.matchblox
        PRODUCT_BUNDLE_IDENTIFIER: $(MATCHBLOX_BUNDLE_ID).buzz
        CODE_SIGN_ENTITLEMENTS: MatchbloxBuzz/MatchbloxBuzz.entitlements

schemes:
  Matchblox:
    build:
      targets:
        Matchblox: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
