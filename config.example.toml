# matchblox — copy to ~/.config/matchblox/config.toml and keep it local.
# Every key is optional; the values below are the defaults unless noted.

interval = "2s"          # cheap counters and tmux panes; processes every 5x and at once for a new pane; git every git.interval
agents = ["claude"]      # agent commands (default ["claude"]); the first run writes the ones it finds, e.g. ["claude", "codex", "opencode"]. Add any other by name
latency_target = ""      # host:port to time a TCP connect against every 10 s, e.g. "example.com:443"

[sessions]
compact_at = 85          # context % at which a session should compact
compact_tokens = 350000  # or this many context tokens, whichever comes first (a 1M window rarely reaches 85%); 0: off
clear_idle = "30m"       # idle this long while holding clear_min_pct context: clear
clear_min_pct = 20
clear_stale = "24h"      # idle this long: clear whatever it holds
progress_prompt = true   # ask each new agent session for a progress bar; the console shows it
# [sessions.windows]     # context window by model-name prefix, for a session whose agent
# "some-model" = 1000000 # reports no window. It wins over the known Claude models. See docs/agents.md

[alerts]                 # a zero threshold is off
temp_over_c = 95
load1_over = 0
load1_for = "2m"         # the condition must hold this long
psi_cpu_over = 0         # PSI cpu "some avg10", percent
psi_cpu_for = "2m"
mem_available_under_gb = 0
swap_over_gb = 0         # swap held although RAM is free:
swap_when_available_over_gb = 0
power_limits_w = []      # expected CPU package limits, long term then short term;
                         # empty alerts when a limit changes from its value at startup

[orphans]                # detached busy loops
cpu_over = 80            # percent of one core
for = "30s"
min_age = "2m"
commands = ["sh", "bash", "zsh", "dash", "fish"]   # empty: any command

# [[groups]]             # CPU share of containers whose name matches
# name = "CI runners"
# container = "runner"   # regular expression

[git]
interval = "5m"
# main = "main"         # default: the branch the remote's HEAD names
remote = "origin"
repos = []               # checkouts to watch besides the ones sessions use

[history]
log = ""                 # default ~/.local/share/matchblox/history.csv; "-" disables
source = ""              # another CSV with a ts column to chart alongside

[stoker]                 # f and n: compact full idle sessions while you are away
night_ends = "07:00"     # n runs the stoker until this time, then turns it off
agent = "claude"         # the stoker agent matchblox starts on its own tmux server (or codex, opencode)
max_steps = 60           # the most messages that agent sends in one run

[ships]                  # pull requests sessions drive, through CI to live
# [ships.deploy]         # the workflows that deploy a repository; a ship is live when they
# "owner/name" = ["Release"]  # finish green. Default: every run on the merge commit

[limits]                 # the 5-hour window and the week of each account
quiet_hours = "23:00-08:00"  # hours you do not usually work, in this machine's time zone: the forecast counts them as a tenth
quiet_days = ["Sat", "Sun"]  # days you do not usually work

[push]                   # the buzz and the island on the phones that registered
relay = "https://matchblox.sh"  # the relay that hands them to Apple; it stores nothing
off = false              # true: no buzz, no island, and no connection to the relay

[hooks]
alert = []               # argv run on each new alert, title and evidence appended,
                         # e.g. ["notify-send", "matchblox"]
